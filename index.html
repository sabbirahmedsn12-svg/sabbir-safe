<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>Sabbir Safe</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  font-family: Arial, sans-serif;
  background: #f8f8f8;
  color: #202124;
}
  .brand-logo {
  width: 42px;
  height: 42px;
  border-radius: 10px;
  object-fit: contain;
  flex-shrink: 0;
  }

body {
  overflow-x: hidden;
}

button {
  font-family: inherit;
  cursor: pointer;
}

header {
  height: 64px;
  width: 100%;
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 14px;
  position: sticky;
  top: 0;
  z-index: 100;
  border-bottom: 1px solid #eee;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 21px;
  font-weight: 700;
}

#settingsBtn {
  border: none;
  background: #f1f1f1;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  font-size: 22px;
}

.category-bar {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  white-space: nowrap;
  padding: 12px 13px;
  background: white;
  position: sticky;
  top: 64px;
  z-index: 90;
  scrollbar-width: none;
}

.category-bar::-webkit-scrollbar {
  display: none;
}

.category-bar button {
  flex-shrink: 0;
  border: none;
  border-radius: 22px;
  background: #eeeeee;
  padding: 11px 17px;
  font-size: 14px;
  color: #222;
}

.category-bar button.active {
  background: #202124;
  color: white;
}

#voiceStatus {
  text-align: center;
  font-size: 12px;
  color: #777;
  padding: 9px;
  background: #f8f8f8;
}

/* ভিডিও প্লেয়ার */

#playerShell {
  display: none;
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #111;
  position: relative;
}

#playerArea {
  width: 100%;
  height: 100%;
  background: #111;
  position: relative;
}

#playerTitle {
  color: white;
  font-size: 13px;
  padding: 7px 10px;
  height: 30px;
  overflow: hidden;
}

#playerBox {
  width: 100%;
  height: calc(100% - 30px);
  background: black;
}

#player {
  width: 100%;
  height: 100%;
}

#player iframe {
  width: 100%;
  height: 100%;
}

.player-controls {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 7px;
  padding: 9px;
  background: #111;
}

.player-controls button {
  border: none;
  border-radius: 7px;
  background: #333;
  color: white;
  padding: 9px 11px;
  font-size: 13px;
}

#miniButton {
  background: #e62117;
}

/* ছোট প্লেয়ার */

#playerArea.mini-mode {
  position: fixed;
  z-index: 200;
  right: 10px;
  bottom: 12px;
  width: 190px;
  height: 130px;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 3px 16px #0007;
}

#playerArea.mini-mode #playerTitle {
  height: 23px;
  font-size: 10px;
  padding: 4px;
}

#playerArea.mini-mode #playerBox {
  height: 107px;
}

#playerArea.mini-mode .player-controls {
  display: none;
}

#expandMini {
  display: none;
  position: fixed;
  z-index: 210;
  bottom: 150px;
  right: 10px;
  border: none;
  border-radius: 20px;
  padding: 9px 13px;
  background: #e62117;
  color: white;
}

#playerArea.mini-mode #expandMini {
  display: block;
}

/* ভিডিও তালিকা */

#videoList {
  width: 100%;
  max-width: 950px;
  margin: auto;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.video-card {
  width: 100%;
  background: white;
  border-radius: 12px;
  overflow: hidden;
}

.thumbnail-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  position: relative;
  background: #111;
  overflow: hidden;
}

.thumbnail-wrap img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
}

.thumbnail-play {
  position: absolute;
  right: 10px;
  bottom: 9px;
  color: white;
  background: #0009;
  border-radius: 5px;
  padding: 5px 9px;
  font-size: 16px;
}

.video-info {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 11px;
}

.channel-logo {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  flex-shrink: 0;
  background: #e62117;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
}

.video-details {
  flex: 1;
  min-width: 0;
}

.video-title {
  font-size: 15px;
  font-weight: bold;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.video-channel {
  color: #777;
  font-size: 12px;
  margin-top: 5px;
}

.save-btn {
  border: 1px solid #ccc;
  background: white;
  border-radius: 5px;
  padding: 7px;
  font-size: 12px;
  flex-shrink: 0;
}

#message {
  text-align: center;
  padding: 25px 10px;
  color: #666;
  font-size: 14px;
}

/* সেটিংস */

#settingsPanel {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 300;
  background: #0008;
  align-items: center;
  justify-content: center;
  padding: 18px;
}

.settings-box {
  background: white;
  width: 100%;
  max-width: 380px;
  border-radius: 15px;
  padding: 20px;
}

.settings-box h3 {
  margin-top: 0;
}

.setting-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 0;
  border-bottom: 1px solid #eee;
}

#closeSettings {
  width: 100%;
  border: none;
  border-radius: 8px;
  background: #e62117;
  color: white;
  padding: 12px;
  margin-top: 16px;
}

.empty-message {
  text-align: center;
  padding: 30px 10px;
  color: #777;
}

@media (min-width: 700px) {
  #videoList {
    max-width: 850px;
  }
}
</style>
</head>

<body>

<header>
  <div class="brand">
  <img class="brand-logo" src="logo.png" alt="Sabbir Safe Logo">
    <span>Sabbir Safe</span>
  </div>
  <button id="settingsBtn" aria-label="সেটিংস">⚙</button>
</header>

<nav class="category-bar">
  <button class="active" data-category="all">সব ভিডিও</button>
  <button data-category="kids">বাচ্চাদের ভিডিও</button>
  <button data-category="islamic">বয়স্কদের ভিডিও</button>
  <button data-category="madrasa">ছাত্রদের ভিডিও</button>
  <button data-category="saved">সেভ করা</button>
</nav>

<div id="voiceStatus">ভয়েস কন্ট্রোল বন্ধ</div>

<section id="playerShell">
  <div id="playerArea">
    <div id="playerTitle">ভিডিও নির্বাচন করুন</div>
    <div id="playerBox">
      <div id="player"></div>
    </div>

    <button id="expandMini">ভিডিও বড় করুন</button>

    <div class="player-controls">
      <button id="previousBtn">⏮ আগের</button>
      <button id="back10Btn">↶ ১০ সেকেন্ড</button>
      <button id="playPauseBtn">▶ / ⏸</button>
      <button id="forward10Btn">১০ সেকেন্ড ↷</button>
      <button id="nextBtn">পরের ⏭</button>
      <button id="muteBtn">🔊 শব্দ</button>
      <button id="fullBtn">⛶ বড়</button>
      <button id="miniButton">ছোট করুন</button>
    </div>
  </div>
</section>

<main id="videoList">
  <div id="message">ভিডিও লোড হচ্ছে...</div>
</main>

<div id="settingsPanel">
  <div class="settings-box">
    <h3>⚙ সেটিংস</h3>

    <div class="setting-row">
      <span>ভয়েস কন্ট্রোল</span>
      <input type="checkbox" id="voiceToggle">
    </div>

    <p style="font-size:13px;color:#666;line-height:1.6">
      ভয়েস কন্ট্রোল চালু করলে অ্যাপ খোলা থাকা অবস্থায়
      ভয়েস কমান্ড কাজ করার চেষ্টা করবে।
      মাইক্রোফোন অনুমতি লাগতে পারে।
    </p>

    <button id="closeSettings">বন্ধ করুন</button>
  </div>
</div>

<script>
 /* =================================
   SABBIR SAFE - MAIN JAVASCRIPT
================================= */

const API_KEY = "AIzaSyDlQZhB4b0r2D9KxnC7dmFNJdKjFO-T1hs";

const PLAYLISTS = {
  kids: "PLPr2-LmXD6s4",
  islamic: "PLVn2mfMGbX9o",
  madrasa: "PLa1OIi8h8b48"
};

let currentCategory = "all";
let videos = [];
let savedVideos = JSON.parse(
  localStorage.getItem("sabbirSafeSaved") || "[]"
);

let pageTokens = {};
let finished = {};
let loading = false;
let savedMode = false;
let player = null;
let playerReady = false;
let currentIndex = -1;
let currentList = [];
let miniMode = false;
let recognition = null;
let voiceEnabled = false;
let autoMiniDone = false;

const videoList = document.getElementById("videoList");
const playerShell = document.getElementById("playerShell");
const playerArea = document.getElementById("playerArea");
const playerTitle = document.getElementById("playerTitle");
const settingsPanel = document.getElementById("settingsPanel");
const voiceStatus = document.getElementById("voiceStatus");

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  })[c]);
}

function showMessage(message) {
  videoList.innerHTML =
    `<div id="message">${escapeHTML(message)}</div>`;
}

function getSaved(id) {
  return savedVideos.some(v => v.id === id);
}

/* YouTube API */

async function fetchPlaylist(playlistId, token) {
  let url =
    "https://www.googleapis.com/youtube/v3/playlistItems" +
    "?part=snippet&maxResults=50" +
    "&playlistId=" + encodeURIComponent(playlistId) +
    "&key=" + encodeURIComponent(API_KEY);

  if (token) {
    url += "&pageToken=" + encodeURIComponent(token);
  }

  const response = await fetch(url);
  const data = await response.json();

  if (!response.ok) {
    throw new Error(data.error?.message || "API সমস্যা");
  }

  return data;
}

async function loadMoreVideos() {
  if (loading || savedMode) return;

  const categories = currentCategory === "all"
    ? ["kids", "islamic", "madrasa"]
    : [currentCategory];

  if (categories.every(c => finished[c])) return;

  loading = true;

  if (videos.length === 0) {
    showMessage("ভিডিও লোড হচ্ছে...");
  }

  try {
    let added = [];

    for (const category of categories) {
      if (finished[category]) continue;

      const data = await fetchPlaylist(
        PLAYLISTS[category],
        pageTokens[category] || ""
      );

      pageTokens[category] = data.nextPageToken || null;
      finished[category] = !data.nextPageToken;

      for (const item of (data.items || [])) {
        const snippet = item.snippet || {};
        const id = snippet.resourceId?.videoId;

        if (!id || videos.some(v => v.id === id)) continue;

        added.push({
          id,
          category,
          title: snippet.title || "ভিডিও",
          thumbnail:
            snippet.thumbnails?.high?.url ||
            snippet.thumbnails?.medium?.url ||
            snippet.thumbnails?.default?.url ||
            "",
          channel: snippet.videoOwnerChannelTitle || ""
        });
      }
    }

    videos.push(...added);
    renderVideos();

    if (videos.length === 0) {
      showMessage("এই ক্যাটাগরিতে কোনো ভিডিও পাওয়া যায়নি।");
    }

  } catch (error) {
    console.error(error);
    showMessage(
      "ভিডিও লোড হয়নি। ইন্টারনেট ও YouTube API Key পরীক্ষা করুন।"
    );
  }

  loading = false;
}

/* ভিডিও কার্ড */

function renderVideos() {
  if (!videos.length) {
    showMessage("কোনো ভিডিও পাওয়া যায়নি।");
    return;
  }

  videoList.innerHTML = videos.map((video, index) => `
    <article class="video-card">
      <div class="thumbnail-wrap"
           onclick="playVideo(${index})">
        <img src="${escapeHTML(video.thumbnail)}"
             alt="ভিডিও থাম্বনেইল"
             loading="lazy">
        <span class="thumbnail-play">▶</span>
      </div>

      <div class="video-info">
        <div class="channel-logo">S</div>

        <div class="video-details">
          <div class="video-title"
               onclick="playVideo(${index})">
            ${escapeHTML(video.title)}
          </div>
          <div class="video-channel">
            ${escapeHTML(video.channel)}
          </div>
        </div>

        <button class="save-btn"
                onclick="toggleSave('${video.id}')">
          ${getSaved(video.id) ? "★ সেভ" : "☆ সেভ"}
        </button>
      </div>
    </article>
  `).join("");
}

/* ক্যাটাগরি */

function changeCategory(category) {
  if (category !== "all" && !PLAYLISTS[category]) return;

  currentCategory = category;
  savedMode = false;
  videos = [];
  pageTokens = {};
  finished = {};

  document.querySelectorAll(".category-bar button").forEach(btn => {
    btn.classList.toggle(
      "active",
      btn.dataset.category === category
    );
  });

  window.scrollTo(0, 0);
  loadMoreVideos();
}

function showSavedVideos() {
  savedMode = true;

  document.querySelectorAll(".category-bar button").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.category === "saved");
  });

  if (!savedVideos.length) {
    showMessage("এখনো কোনো ভিডিও সেভ করা হয়নি।");
    return;
  }

  videoList.innerHTML = savedVideos.map((video, index) => `
    <article class="video-card">
      <div class="thumbnail-wrap"
           onclick="playSavedVideo(${index})">
        <img src="${escapeHTML(video.thumbnail)}"
             alt="ভিডিও থাম্বনেইল"
             loading="lazy">
        <span class="thumbnail-play">▶</span>
      </div>

      <div class="video-info">
        <div class="channel-logo">S</div>
        <div class="video-details">
          <div class="video-title"
               onclick="playSavedVideo(${index})">
            ${escapeHTML(video.title)}
          </div>
          <div class="video-channel">
            ${escapeHTML(video.channel)}
          </div>
        </div>
        <button class="save-btn"
                onclick="toggleSave('${video.id}')">
          ★ সেভ
        </button>
      </div>
    </article>
  `).join("");
}

function toggleSave(id) {
  const video = videos.find(v => v.id === id) ||
                savedVideos.find(v => v.id === id);

  if (!video) return;

  if (getSaved(id)) {
    savedVideos = savedVideos.filter(v => v.id !== id);
  } else {
    savedVideos.unshift(video);
  }

  localStorage.setItem(
    "sabbirSafeSaved",
    JSON.stringify(savedVideos)
  );

  if (savedMode) {
    showSavedVideos();
  } else {
    renderVideos();
  }
}

/* YouTube Player */

function loadPlayerAPI() {
  if (window.YT && window.YT.Player) {
    createPlayer();
    return;
  }

  window.onYouTubeIframeAPIReady = createPlayer;

  const script = document.createElement("script");
  script.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(script);
}

function createPlayer() {
  if (player) return;

  player = new YT.Player("player", {
    width: "100%",
    height: "100%",
    videoId: "",
    playerVars: {
      playsinline: 1,
      rel: 0
    },
    events: {
      onReady: function() {
        playerReady = true;
      },
      onStateChange: function(event) {
        if (
          event.data === YT.PlayerState.ENDED &&
          currentList.length
        ) {
          nextVideo();
        }
      }
    }
  });
}

function playVideo(index) {
  currentList = videos;
  currentIndex = index;
  startSelectedVideo();
}

function playSavedVideo(index) {
  currentList = savedVideos;
  currentIndex = index;
  startSelectedVideo();
}

function startSelectedVideo() {
  if (!playerReady || !player) {
    alert("ভিডিও প্লেয়ার প্রস্তুত হচ্ছে। একটু অপেক্ষা করুন।");
    return;
  }

  const video = currentList[currentIndex];
  if (!video) return;

  playerTitle.textContent = video.title;
  playerShell.style.display = "block";
  miniMode = false;
  autoMiniDone = false;
  playerArea.classList.remove("mini-mode");

  player.loadVideoById(video.id);

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}

function nextVideo() {
  if (!currentList.length) return;
  currentIndex = (currentIndex + 1) % currentList.length;
  startSelectedVideo();
}

function previousVideo() {
  if (!currentList.length) return;
  currentIndex =
    (currentIndex - 1 + currentList.length) % currentList.length;
  startSelectedVideo();
}

function togglePlayPause() {
  if (!playerReady) return;

  if (player.getPlayerState() === YT.PlayerState.PLAYING) {
    player.pauseVideo();
  } else {
    player.playVideo();
  }
}

function seek(seconds) {
  if (!playerReady) return;

  player.seekTo(
    Math.max(0, player.getCurrentTime() + seconds),
    true
  );
}

function toggleMute() {
  if (!playerReady) return;

  if (player.isMuted()) {
    player.unMute();
  } else {
    player.mute();
  }
}

function fullscreen() {
  const iframe = playerArea.querySelector("iframe");

  if (iframe && iframe.requestFullscreen) {
    iframe.requestFullscreen();
  }
}

/* ছোট প্লেয়ার */

function setMiniMode(enabled) {
  miniMode = enabled;
  playerArea.classList.toggle("mini-mode", enabled);
}

function expandPlayer() {
  setMiniMode(false);
  autoMiniDone = false;
}

document.getElementById("miniButton").onclick = () => {
  setMiniMode(true);
};

document.getElementById("expandMini").onclick = expandPlayer;

/* স্ক্রলিং: প্লেয়ার স্ক্রিনের বাইরে গেলে ছোট হবে */

window.addEventListener("scroll", () => {
  if (!playerReady || playerShell.style.display === "none") return;

  const rect = playerShell.getBoundingClientRect();

  if (rect.bottom < 0 && !miniMode && !autoMiniDone) {
    setMiniMode(true);
    autoMiniDone = true;
  }
});

/* নিচে গেলে আরও ভিডিও */

window.addEventListener("scroll", () => {
  if (
    window.innerHeight + window.scrollY >=
    document.documentElement.scrollHeight - 500
  ) {
    loadMoreVideos();
  }
});

/* সেটিংস */

document.getElementById("settingsBtn").onclick = () => {
  settingsPanel.style.display = "flex";
};

document.getElementById("closeSettings").onclick = () => {
  settingsPanel.style.display = "none";
};

/* ভয়েস কন্ট্রোল */

function stopVoice() {
  voiceEnabled = false;

  if (recognition) {
    recognition.onend = null;
    recognition.stop();
    recognition = null;
  }

  voiceStatus.textContent = "ভয়েস কন্ট্রোল বন্ধ";
}

function startVoice() {
  if (!("webkitSpeechRecognition" in window)) {
    voiceStatus.textContent =
      "এই WebView-তে ভয়েস কন্ট্রোল সমর্থিত নয়";
    document.getElementById("voiceToggle").checked = false;
    return;
  }

  voiceEnabled = true;
  recognition = new webkitSpeechRecognition();
  recognition.lang = "bn-BD";
  recognition.continuous = true;
  recognition.interimResults = false;

  recognition.onresult = event => {
    const command =
      event.results[event.results.length - 1][0]
        .transcript.toLowerCase();

    if (command.includes("বন্ধ") || command.includes("থাম")) {
      player?.pauseVideo();
    } else if (command.includes("চালু") || command.includes("প্লে")) {
      player?.playVideo();
    } else if (command.includes("পরের")) {
      nextVideo();
    } else if (command.includes("আগের")) {
      previousVideo();
    } else if (command.includes("সামনে")) {
      seek(10);
    } else if (command.includes("পিছনে")) {
      seek(-10);
    } else if (command.includes("মিউট")) {
      player?.mute();
    } else if (command.includes("আনমিউট")) {
      player?.unMute();
    }
  };

  recognition.onerror = () => {
    voiceStatus.textContent = "ভয়েস কন্ট্রোলে সমস্যা হয়েছে";
  };

  recognition.onend = () => {
    if (voiceEnabled) {
      try {
        recognition.start();
      } catch (error) {}
    }
  };

  try {
    recognition.start();
    voiceStatus.textContent = "🎙 ভয়েস কন্ট্রোল চালু";
  } catch (error) {
    voiceStatus.textContent = "মাইক্রোফোন অনুমতি পরীক্ষা করুন";
  }
}

document.getElementById("voiceToggle").onchange = event => {
  if (event.target.checked) {
    startVoice();
  } else {
    stopVoice();
  }
};

/* সব বাটন */

document.getElementById("previousBtn").onclick = previousVideo;
document.getElementById("nextBtn").onclick = nextVideo;
document.getElementById("playPauseBtn").onclick = togglePlayPause;
document.getElementById("back10Btn").onclick = () => seek(-10);
document.getElementById("forward10Btn").onclick = () => seek(10);
document.getElementById("muteBtn").onclick = toggleMute;
document.getElementById("fullBtn").onclick = fullscreen;

/* ক্যাটাগরি বাটন */

document.querySelectorAll(".category-bar button").forEach(button => {
  button.addEventListener("click", () => {
    const category = button.dataset.category;

    if (category === "saved") {
      showSavedVideos();
    } else {
      changeCategory(category);
    }
  });
});

/* Android Back */

window.handleAndroidBack = function() {
  if (settingsPanel.style.display === "flex") {
    settingsPanel.style.display = "none";
    return true;
  }

  if (miniMode) {
    expandPlayer();
    return true;
  }

  return false;
};

/* অ্যাপ চালু */

window.addEventListener("load", () => {
  loadPlayerAPI();
  changeCategory("all");
});
</script>
</body>
</html>

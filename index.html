let currentSection="";
let currentIndex=0;
let player=null;
let apiReady=false;
let playerCreating=false;

function onYouTubeIframeAPIReady(){
apiReady=true;
}

function openSection(section){
currentSection=section;
currentIndex=0;
document.getElementById("choose").classList.add("hidden");
document.getElementById("home").classList.remove("hidden");
document.getElementById("sectionTitle").textContent=
section==="child"?"🧒 শিশু বিভাগ":"🕌 বড়দের বিভাগ";
renderList();
loadVideo(0);
}

function renderList(){
const area=document.getElementById("videoList");
area.innerHTML="";
videos[currentSection].forEach((video,index)=>{
const item=document.createElement("div");
item.className="video-card";
const icon=document.createElement("span");
icon.textContent="▶️";
const title=document.createElement("strong");
title.textContent=video.title;
const btn=document.createElement("button");
btn.textContent="দেখুন";
btn.onclick=()=>loadVideo(index);
item.append(icon,title,btn);
area.appendChild(item);
});
}

function loadVideo(index){
const list=videos[currentSection];
if(!list || index<0 || index>=list.length)return;
currentIndex=index;
const video=list[index];

document.getElementById("videoTitle").textContent=video.title;
document.getElementById("videoNumber").textContent=
"ভিডিও "+(index+1)+" / "+list.length;

if(!apiReady){
document.getElementById("videoTitle").textContent="YouTube প্রস্তুত হচ্ছে...";
setTimeout(()=>loadVideo(index),700);
return;
}

if(player && player.loadVideoById){
player.loadVideoById(video.id);
return;
}

if(playerCreating)return;
playerCreating=true;

player=new YT.Player("player",{
width:"100%",
height:"100%",
videoId:video.id,
playerVars:{
autoplay:1,
controls:1,
rel:0,
playsinline:1
},
events:{
onReady:function(event){
playerCreating=false;
event.target.playVideo();
},
onStateChange:function(event){
if(event.data===YT.PlayerState.ENDED){
nextVideo();
}
}
}
});
}

function nextVideo(){
if(currentIndex<videos[currentSection].length-1){
loadVideo(currentIndex+1);
}else{
document.getElementById("videoTitle").textContent="সব ভিডিও দেখা শেষ!";
}
}

function previousVideo(){
if(currentIndex>0)loadVideo(currentIndex-1);
}

function skipVideo(){
nextVideo();
}

function goBack(){
if(player && player.stopVideo)player.stopVideo();
document.getElementById("home").classList.add("hidden");
document.getElementById("choose").classList.remove("hidden");
}

<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sabbir Safe</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f7f6;color:#172820;font-family:Arial,sans-serif}
header{background:#087f5b;color:white;padding:15px;position:sticky;top:0;z-index:5}
.brand{font-size:23px;font-weight:bold}
.brand small{font-size:11px;display:block;margin-top:4px}
.container{padding:14px;max-width:850px;margin:auto}
h2{font-size:19px}
.hidden{display:none!important}
.search{width:100%;padding:14px;border:1px solid #ddd;border-radius:25px;font-size:15px;outline:none;background:white}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.choice{background:white;border-radius:16px;padding:22px 8px;text-align:center;box-shadow:0 2px 9px #0001}
.choice .emoji{font-size:43px}
.choice h2{font-size:17px}
button{border:0;background:#087f5b;color:white;border-radius:10px;padding:11px 14px;font-size:14px;cursor:pointer}
.choice button{width:100%}
.category{display:flex;gap:8px;overflow-x:auto;padding:12px 0}
.category button{white-space:nowrap;background:#e3eee9;color:#176b50}
.category button.active{background:#087f5b;color:white}
.video-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.video-card{background:white;border-radius:13px;overflow:hidden;box-shadow:0 2px 7px #0001;cursor:pointer}
.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;background:#dcebe4;display:block}
.video-title{padding:10px;font-size:13px;font-weight:bold;line-height:1.5}
.player-box{background:#fff;border-radius:14px;padding:10px;margin:12px 0}
#player{width:100%;aspect-ratio:16/9;background:#111;border-radius:9px;overflow:hidden}
#player iframe{width:100%;height:100%;border:0}
.player-controls{display:flex;gap:7px;margin:12px 0}
.player-controls button{flex:1;padding:12px 3px}
.player-title{font-weight:bold;font-size:16px;padding:5px}
.player-note{font-size:12px;color:#69756f}
.back{background:#53645d;width:100%;margin-top:15px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:space-around;padding:11px;border-top:1px solid #ddd;z-index:4}
.bottom button{background:white;color:#087f5b;font-size:12px}
.page-space{height:65px}
.empty{padding:20px;text-align:center;color:#68736e}
@media(min-width:650px){.video-grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>

<header>
<div class="brand">▶ Sabbir Safe
<small>নিরাপদ ভিডিও দেখার জগৎ</small>
</div>
</header>

<section id="choose" class="container">
<h2>আপনার বিভাগ নির্বাচন করুন</h2>
<div class="choices">
<div class="choice">
<div class="emoji">🧒</div>
<h2>শিশু বিভাগ</h2>
<p>ছড়া, কার্টুন ও শিক্ষা</p>
<button onclick="openSection('child')">প্রবেশ করুন</button>
</div>
<div class="choice">
<div class="emoji">🕌</div>
<h2>বড়দের বিভাগ</h2>
<p>কুরআন, ওয়াজ ও গজল</p>
<button onclick="openSection('adult')">প্রবেশ করুন</button>
</div>
</div>
</section>

<section id="home" class="hidden">
<div class="container">
<input class="search" id="search" placeholder="🔍 ভিডিও খুঁজুন..." oninput="renderVideos()">

<div class="category">
<button class="active" onclick="setCategory('all',this)">সব ভিডিও</button>
<button onclick="setCategory('first',this)">প্রথম ভিডিও</button>
</div>

<h2 id="homeTitle">ভিডিও দেখুন</h2>
<div id="videoGrid" class="video-grid"></div>
<button class="back" onclick="goBack()">বিভাগ পরিবর্তন করুন</button>
</div>
<div class="page-space"></div>
</section>

<section id="watch" class="hidden">
<div class="container">
<div class="player-box">
<div id="player">
<div style="color:white;text-align:center;padding:55px 5px">ভিডিও লোড হচ্ছে...</div>
</div>
<h3 id="playingTitle" class="player-title"></h3>
<p id="playingNumber" class="player-note"></p>
<div class="player-controls">
<button onclick="previousVideo()">⏮ আগের</button>
<button onclick="skipVideo()">⏭ Skip</button>
<button onclick="nextVideo()">Next ⏭</button>
</div>
<p class="player-note" id="playerMessage">ভিডিও অ্যাপের ভেতরে চালু হবে।</p>
</div>

<h2>পরবর্তী ভিডিও</h2>
<div id="nextGrid" class="video-grid"></div>
<button class="back" onclick="backToHome()">← ভিডিও তালিকায় ফিরুন</button>
</div>
<div class="page-space"></div>
</section>

<nav class="bottom hidden" id="bottomNav">
<button onclick="backToHome()">⌂<br>হোম</button>
<button onclick="goBack()">⇄<br>বিভাগ</button>
</nav>

<script src="https://www.youtube.com/iframe_api"></script>

]
};

let section="";
let index=0;
let player=null;
let apiReady=false;
let category="all";

function onYouTubeIframeAPIReady(){
apiReady=true;
}

function openSection(s){
section=s;
index=0;
document.getElementById("choose").classList.add("hidden");
document.getElementById("home").classList.remove("hidden");
document.getElementById("bottomNav").classList.remove("hidden");
document.getElementById("homeTitle").textContent=
s==="child"?"🧒 শিশু বিভাগের ভিডিও":"🕌 বড়দের ভিডিও";
document.getElementById("search").value="";
renderVideos();
}

function setCategory(c,btn){
category=c;
document.querySelectorAll(".category button").forEach(b=>b.classList.remove("active"));
btn.classList.add("active");
renderVideos();
}

function renderVideos(){
const grid=document.getElementById("videoGrid");
grid.innerHTML="";
const query=document.getElementById("search").value.toLowerCase();

videos[section].forEach((v,i)=>{
if(!v[1].toLowerCase().includes(query))return;
if(category==="first" && i!==0)return;

const card=document.createElement("div");
card.className="video-card";

const img=document.createElement("img");
img.className="thumb";
img.loading="lazy";
img.src="https://i.ytimg.com/vi/"+v[0]+"/hqdefault.jpg";
img.alt=v[1];

const title=document.createElement("div");
title.className="video-title";
title.textContent=v[1];

card.append(img,title);
card.onclick=()=>playVideo(i);
grid.appendChild(card);
});

if(!grid.children.length){
grid.innerHTML='<div class="empty">কোনো ভিডিও পাওয়া যায়নি।</div>';
}
}

function playVideo(i){
index=i;
document.getElementById("home").classList.add("hidden");
document.getElementById("watch").classList.remove("hidden");
document.getElementById("bottomNav").classList.add("hidden");
updatePlayerInfo();
renderNext();

if(!apiReady){
document.getElementById("playerMessage").textContent="YouTube প্লেয়ার প্রস্তুত হচ্ছে...";
setTimeout(()=>playVideo(index),700);
return;
}

if(player && player.loadVideoById){
player.loadVideoById(videos[section][index][0]);
return;
}

player=new YT.Player("player",{
width:"100%",
height:"100%",
videoId:videos[section][index][0],
playerVars:{
autoplay:1,
controls:1,
rel:0,
playsinline:1,
fs:1
},
events:{
onReady:function(e){
e.target.playVideo();
},
onStateChange:function(e){
if(e.data===YT.PlayerState.ENDED){
nextVideo();
}
},
onError:function(){
document.getElementById("playerMessage").textContent=
"এই ভিডিওটি অ্যাপের ভেতরে চালানো যাচ্ছে না। অন্য ভিডিও চেষ্টা করুন।";
}
}
});
}

function updatePlayerInfo(){
const v=videos[section][index];
document.getElementById("playingTitle").textContent=v[1];
document.getElementById("playingNumber").textContent=
"ভিডিও "+(index+1)+" / "+videos[section].length;
}

function renderNext(){
const grid=document.getElementById("nextGrid");
grid.innerHTML="";
videos[section].forEach((v,i)=>{
if(i<=index)return;
const card=document.createElement("div");
card.className="video-card";
const img=document.createElement("img");
img.className="thumb";
img.src="https://i.ytimg.com/vi/"+v[0]+"/hqdefault.jpg";
img.alt=v[1];
const title=document.createElement("div");
title.className="video-title";
title.textContent=v[1];
card.append(img,title);
card.onclick=()=>playVideo(i);
grid.appendChild(card);
});
}

function nextVideo(){
if(index<videos[section].length-1){
playVideo(index+1);
}else{
document.getElementById("playingTitle").textContent="সব ভিডিও দেখা শেষ!";
}
}

function previousVideo(){
if(index>0)playVideo(index-1);
}

function skipVideo(){
nextVideo();
}

function backToHome(){
if(player && player.pauseVideo)player.pauseVideo();
document.getElementById("watch").classList.add("hidden");
document.getElementById("home").classList.remove("hidden");
document.getElementById("bottomNav").classList.remove("hidden");
renderVideos();
}

function goBack(){
if(player && player.stopVideo)player.stopVideo();
section="";
document.getElementById("home").classList.add("hidden");
document.getElementById("watch").classList.add("hidden");
document.getElementById("choose").classList.remove("hidden");
document.getElementById("bottomNav").classList.add("hidden");
}
</script>

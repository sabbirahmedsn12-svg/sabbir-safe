<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sabbir Safe</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f6f5;color:#172b25;font-family:Arial,sans-serif}
header{background:#087f5b;color:white;padding:17px;font-size:23px;font-weight:bold}
header small{display:block;font-size:12px;margin-top:5px}
.container{padding:16px}
h2{text-align:center}
.choice,.video-card,.player-box{background:white;border-radius:14px;padding:16px;margin:14px 0;box-shadow:0 2px 9px #0001}
.choice{text-align:center}
button{border:0;border-radius:9px;padding:12px;background:#087f5b;color:white;font-size:15px;cursor:pointer}
.choice button{width:100%;margin-top:10px}
.child{border-top:5px solid #ffb703}
.adult{border-top:5px solid #087f5b}
.hidden{display:none}
.top-buttons{display:flex;gap:8px;margin:12px 0}
.top-buttons button{flex:1}
#player{width:100%;aspect-ratio:16/9;background:#111;border-radius:10px;overflow:hidden}
#player iframe{width:100%;height:100%;border:0}
.controls{display:flex;gap:7px;margin-top:12px}
.controls button{flex:1;padding:11px 4px}
.video-card{display:flex;align-items:center;gap:12px}
.video-card button{margin-left:auto}
.thumb{font-size:32px}
.small{font-size:13px;color:#66736e}
.back{width:100%;margin-top:15px;background:#52645d}
</style>
</head>
<body>

<header>
Sabbir Safe
<small>নিরাপদ ভিডিও দেখার জগৎ</small>
</header>

<section id="choose" class="container">
<h2>আপনার বিভাগ নির্বাচন করুন</h2>

<div class="choice child">
<h2>🧒 শিশু বিভাগ</h2>
<p>ছড়া, কার্টুন ও শিক্ষামূলক ভিডিও</p>
<button onclick="openSection('child')">প্রবেশ করুন</button>
</div>

<div class="choice adult">
<h2>🕌 বড়দের বিভাগ</h2>
<p>কুরআন, ওয়াজ, গজল ও ইসলামিক শিক্ষা</p>
<button onclick="openSection('adult')">প্রবেশ করুন</button>
</div>
</section>

<section id="home" class="hidden">
<div class="container">
<h2 id="sectionTitle"></h2>

<div class="player-box">
<div class="top-buttons">
<button onclick="previousVideo()">⏮ Previous</button>
<button onclick="skipVideo()">⏭ Skip</button>
<button onclick="nextVideo()">Next ⏭</button>
</div>

<div id="player">
<div style="color:white;text-align:center;padding:55px 10px">
ভিডিও নির্বাচন করুন
</div>
</div>

<h3 id="videoTitle">Sabbir Safe Video Player</h3>
<p class="small" id="videoNumber"></p>
</div>

<h3>ভিডিও তালিকা</h3>
<div id="videoList"></div>

<button class="back" onclick="goBack()">বিভাগ পরিবর্তন</button>
</div>
</section>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
/*
ভিডিও যুক্ত করার নিয়ম:
প্রতিটি ভিডিওর id ঘরে YouTube লিংকের ভিডিও ID বসাতে হবে।
উদাহরণ: youtube.com/watch?v=abcdefghijk
ID হবে: abcdefghijk
*/

const videos = {
child: [
  // শিশুদের ভিডিও এখানে যুক্ত হবে
],
adult: [
  // বড়দের ভিডিও এখানে যুক্ত হবে
]
};

let currentSection = "";
let currentIndex = 0;
let player = null;
let playerReady = false;

function openSection(section){
  currentSection = section;
  currentIndex = 0;
  document.getElementById("choose").classList.add("hidden");
  document.getElementById("home").classList.remove("hidden");
  document.getElementById("sectionTitle").innerText =
    section === "child" ? "🧒 শিশু বিভাগের ভিডিও" : "🕌 বড়দের বিভাগের ভিডিও";
  renderList();
  loadVideo(0);
}

function renderList(){
  const list = videos[currentSection];
  const area = document.getElementById("videoList");
  area.innerHTML = "";

  if(list.length === 0){
    area.innerHTML = '<div class="video-card">এখনো কোনো ভিডিও যুক্ত করা হয়নি। ভিডিওর লিংক দিলে এখানে যোগ করা হবে।</div>';
    return;
  }

  list.forEach((video,index)=>{
    const item = document.createElement("div");
    item.className = "video-card";

    const icon = document.createElement("span");
    icon.className = "thumb";
    icon.textContent = "▶️";

    const title = document.createElement("strong");
    title.textContent = video.title;

    const btn = document.createElement("button");
    btn.textContent = "দেখুন";
    btn.onclick = ()=>loadVideo(index);

    item.append(icon,title,btn);
    area.appendChild(item);
  });
}

function onYouTubeIframeAPIReady(){
  // YouTube Player API প্রস্তুত হলে ভিডিও নির্বাচনের সময় প্লেয়ার তৈরি হবে।
}

function loadVideo(index){
  const list = videos[currentSection];
  if(!list || list.length === 0) return;
  if(index < 0 || index >= list.length) return;

  currentIndex = index;
  const video = list[index];

  document.getElementById("videoTitle").textContent = video.title;
  document.getElementById("videoNumber").textContent =
    "ভিডিও " + (index+1) + " / " + list.length;

  if(player && player.loadVideoById){
    player.loadVideoById(video.id);
  }else{
    createPlayer(video.id);
  }
}

function createPlayer(videoId){
  if(!window.YT || !YT.Player){
    setTimeout(()=>createPlayer(videoId),500);
    return;
  }

  player = new YT.Player("player",{
    videoId: videoId,
    playerVars:{
      autoplay:1,
      controls:1,
      rel:0,
      playsinline:1
    },
    events:{
      onReady:function(event){
        playerReady = true;
        event.target.playVideo();
      },
      onStateChange:function(event){
        if(event.data === YT.PlayerState.ENDED){
          nextVideo();
        }
      }
    }
  });
}

function nextVideo(){
  const list = videos[currentSection];
  if(!list || currentIndex >= list.length-1) return;
  loadVideo(currentIndex+1);
}

function previousVideo(){
  if(currentIndex > 0) loadVideo(currentIndex-1);
}

function skipVideo(){
  nextVideo();
}

function goBack(){
  if(player && player.stopVideo) player.stopVideo();
  document.getElementById("home").classList.add("hidden");
  document.getElementById("choose").classList.remove("hidden");
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sabbir Safe</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#f8f9fa;color:#202124;
 font-family:Arial,"Noto Sans Bengali",sans-serif;
}
header{
 height:62px;background:white;display:flex;align-items:center;
 justify-content:space-between;padding:0 14px;
 position:sticky;top:0;z-index:20;
 box-shadow:0 1px 5px #ddd;
}
.brand{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:bold}
.logo{
 width:38px;height:27px;background:#e62117;border-radius:8px;
 display:grid;place-items:center;color:white;font-size:17px;
}
#settingsBtn{
 border:0;background:#f1f3f4;border-radius:50%;
 width:42px;height:42px;font-size:22px;
}
.category-bar{
 display:flex;gap:8px;padding:12px;overflow-x:auto;
 background:white;position:sticky;top:62px;z-index:15;
}
.category-bar button{
 border:0;border-radius:20px;padding:10px 15px;
 background:#eee;white-space:nowrap;font-size:14px;
}
.category-bar button.active{background:#202124;color:white}
#playerArea{
 display:none;background:#111;padding:8px;
 position:relative;z-index:10;
}
#playerBox{
 width:100%;aspect-ratio:16/9;max-width:850px;
 margin:auto;background:black;overflow:hidden;
}
#player{width:100%;height:100%}
#player iframe{width:100%;height:100%}
.player-controls{
 display:flex;justify-content:center;align-items:center;
 gap:9px;flex-wrap:wrap;padding:10px 0;
}
.player-controls button{
 border:0;border-radius:8px;padding:9px 12px;
 background:#333;color:white;font-size:14px;
}
#miniButton{background:#e62117}
#playerTitle{color:white;font-size:14px;padding:5px}
#videoList{
 display:grid;grid-template-columns:1fr;gap:16px;
 padding:12px;max-width:1000px;margin:auto;
}
.video-card{background:white;border-radius:12px;overflow:hidden}
.thumbnail{
 width:100%;aspect-ratio:16/9;object-fit:cover;
 background:#ddd;display:block;
}
.video-info{display:flex;gap:10px;padding:10px}
.channel-icon{
 width:36px;height:36px;border-radius:50%;
 background:#e62117;color:white;display:grid;
 place-items:center;flex-shrink:0;font-weight:bold;
}
.video-text{flex:1;min-width:0}
.video-title{font-size:15px;font-weight:bold;line-height:1.5}
.video-date{font-size:12px;color:#777;margin-top:6px}
.card-actions{display:flex;gap:8px;padding:0 10px 12px}
.card-actions button{
 border:0;border-radius:8px;padding:8px 12px;
 background:#eee;font-size:13px;
}
.card-actions .watch{background:#e62117;color:white}
#message{text-align:center;padding:20px;color:#666}
#settingsPanel{
 display:none;position:fixed;inset:0;background:#0008;
 z-index:50;align-items:center;justify-content:center;padding:18px;
}
.settings-box{
 width:100%;max-width:380px;background:white;
 border-radius:15px;padding:20px;
}
.settings-box h3{margin-top:0}
.setting-row{
 display:flex;justify-content:space-between;align-items:center;
 padding:14px 0;border-bottom:1px solid #eee;
}
#closeSettings{
 width:100%;padding:12px;border:0;border-radius:8px;
 background:#e62117;color:white;margin-top:15px;
}
#voiceStatus{
 font-size:12px;color:#777;text-align:center;padding:6px;
}
.mini-mode{
 position:fixed!important;right:10px;bottom:12px;
 width:190px!important;max-width:190px!important;
 padding:5px!important;border-radius:10px;
 box-shadow:0 2px 15px #0008;
}
.mini-mode #playerBox{
 width:100%!important;height:107px!important;
 aspect-ratio:auto!important;
}
.mini-mode .player-controls{display:none}
.mini-mode #playerTitle{font-size:11px}
#expandMini{
 display:none;position:fixed;right:12px;bottom:130px;
 z-index:30;background:#e62117;color:white;
 border:0;border-radius:20px;padding:9px 12px;
}
.mini-mode #expandMini{display:block}
.empty{text-align:center;color:#777;padding:30px}
@media(min-width:650px){
 #videoList{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

<body>

<header>
 <div class="brand">
  <div class="logo">▶</div>
  <span>Sabbir Safe</span>
 </div>
 <button id="settingsBtn" aria-label="সেটিংস">⚙</button>
</header>

<nav class="category-bar">
 <button class="active" data-category="all">সব ভিডিও</button>
 <button data-category="kids">বাচ্চাদের ভিডিও</button>
 <button data-category="islamic">বয়স্কদের ভিডিও</button>
 <button data-category="madrasa">ছাত্রদের ভিডিও</button>
 <button data-category="saved">সেভ করা</button>
</nav>

<section id="playerArea">
 <div id="playerTitle">ভিডিও নির্বাচন করুন</div>
 <div id="playerBox">
  <div id="player"></div>
 </div>
 <button id="expandMini">ভিডিও বড় করুন</button>
 <div class="player-controls">
  <button id="previousBtn">⏮ আগের</button>
  <button id="back10Btn">↶ ১০ সেকেন্ড</button>
  <button id="playPauseBtn">▶ / ⏸</button>
  <button id="forward10Btn">১০ সেকেন্ড ↷</button>
  <button id="nextBtn">পরের ⏭</button>
  <button id="muteBtn">🔊 শব্দ</button>
  <button id="fullBtn">⛶ বড়</button>
  <button id="miniButton">ছোট করুন</button>
 </div>
</section>

<div id="voiceStatus">ভয়েস কন্ট্রোল বন্ধ</div>

<main id="videoList">
 <div id="message">ভিডিও লোড হচ্ছে...</div>
</main>

<div id="settingsPanel">
 <div class="settings-box">
  <h3>⚙ সেটিংস</h3>
  <div class="setting-row">
   <span>ভয়েস কন্ট্রোল</span>
   <input type="checkbox" id="voiceToggle">
  </div>
  <p style="font-size:13px;color:#666">
   চালু করলে অ্যাপ খোলা থাকা অবস্থায় ভয়েস কমান্ড কাজ করার চেষ্টা করবে।
   মাইক্রোফোন অনুমতি লাগতে পারে।
  </p>
  <button id="closeSettings">বন্ধ করুন</button>
 </div>
</div>

<script>
  /* =====================================
   SABBIR SAFE - JAVASCRIPT
===================================== */

const API_KEY = "AIzaSyDlQZhB4b0r2D9KxnC7dmFNJdKjFO-T1hs";

const PLAYLISTS = {
  kids: "PLPr2-LmXD6s4",
  islamic: "PLVn2mfMGbX9o",
  madrasa: "PLa1OIi8h8b48"
};

const CATEGORY_NAMES = {
  all: "সব ভিডিও",
  kids: "বাচ্চাদের ভিডিও",
  islamic: "বয়স্কদের ভিডিও",
  madrasa: "ছাত্রদের ভিডিও"
};

let currentCategory = "all";
let videos = [];
let nextPageTokens = {};
let loading = false;
let savedVideos = JSON.parse(localStorage.getItem("sabbirSavedVideos") || "[]");
let savedMode = false;
let currentVideoIndex = -1;
let player = null;
let playerReady = false;
let voiceEnabled = false;
let recognition = null;
let miniMode = false;

const videoList = document.getElementById("videoList");
const playerArea = document.getElementById("playerArea");
const playerBox = document.getElementById("player");
const settingsPanel = document.getElementById("settingsPanel");

function getVideoId(item) {
  return item.snippet?.resourceId?.videoId || "";
}

function getVideoInfo(item) {
  const snippet = item.snippet || {};
  return {
    id: getVideoId(item),
    title: snippet.title || "ভিডিও",
    thumbnail:
      snippet.thumbnails?.medium?.url ||
      snippet.thumbnails?.default?.url ||
      "",
    channel: snippet.videoOwnerChannelTitle || "",
    playlist: item.playlist || ""
  };
}

async function fetchPlaylist(playlistId, pageToken = "") {
  let url =
    "https://www.googleapis.com/youtube/v3/playlistItems" +
    "?part=snippet&maxResults=50" +
    "&playlistId=" + encodeURIComponent(playlistId) +
    "&key=" + encodeURIComponent(API_KEY);

  if (pageToken) {
    url += "&pageToken=" + encodeURIComponent(pageToken);
  }

  const response = await fetch(url);
  const data = await response.json();

  if (!response.ok) {
    throw new Error(data.error?.message || "ভিডিও লোড করা যায়নি");
  }

  return data;
}

async function loadMoreVideos() {
  if (loading || savedMode) return;

  loading = true;

  try {
    let playlists = [];

    if (currentCategory === "all") {
      playlists = Object.entries(PLAYLISTS);
    } else {
      playlists = [[currentCategory, PLAYLISTS[currentCategory]]];
    }

    let newVideos = [];

    for (const [category, playlistId] of playlists) {
      const token = nextPageTokens[category] || "";

      if (nextPageTokens[category] === null) continue;

      const data = await fetchPlaylist(playlistId, token);

      const items = (data.items || []).map(item => ({
        ...getVideoInfo(item),
        category
      }));

      newVideos.push(...items);

      nextPageTokens[category] = data.nextPageToken || null;
    }

    newVideos = newVideos.filter(video =>
      video.id && !videos.some(old => old.id === video.id)
    );

    videos.push(...newVideos);
    renderVideos();

  } catch (error) {
    console.error(error);
    showMessage("ভিডিও লোড হয়নি। API Key ও ইন্টারনেট পরীক্ষা করুন।");
  }

  loading = false;
}

function renderVideos() {
  if (!videoList) return;

  if (videos.length === 0) {
    videoList.innerHTML = "<p>কোনো ভিডিও পাওয়া যায়নি।</p>";
    return;
  }

  videoList.innerHTML = videos.map((video, index) => `
    <div class="video-card">
      <div class="thumbnail" onclick="playVideo('${video.id}', ${index})">
        <img src="${video.thumbnail}" alt="ভিডিও থাম্বনেইল">
        <span class="play-icon">▶</span>
      </div>

      <div class="video-info">
        <div class="video-title"
             onclick="playVideo('${video.id}', ${index})">
          ${escapeHTML(video.title)}
        </div>

        <button onclick="toggleSave('${video.id}')">
          ${savedVideos.some(v => v.id === video.id) ? "★ সেভ করা" : "☆ সেভ"}
        </button>
      </div>
    </div>
  `).join("");
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  })[char]);
}

function changeCategory(category) {
  if (!PLAYLISTS[category] && category !== "all") return;

  currentCategory = category;
  savedMode = false;
  videos = [];
  nextPageTokens = {};

  document.querySelectorAll(".category-bar button").forEach(button => {
    button.classList.toggle(
      "active",
      button.dataset.category === category
    );
  });

  loadMoreVideos();
  window.scrollTo(0, 0);
}

function toggleSave(videoId) {
  const video = videos.find(v => v.id === videoId);
  if (!video) return;

  const exists = savedVideos.some(v => v.id === videoId);

  if (exists) {
    savedVideos = savedVideos.filter(v => v.id !== videoId);
  } else {
    savedVideos.unshift(video);
  }

  localStorage.setItem(
    "sabbirSavedVideos",
    JSON.stringify(savedVideos)
  );

  if (savedMode) {
    showSavedVideos();
  } else {
    renderVideos();
  }
}

function showSavedVideos() {
  savedMode = true;
  videoList.innerHTML = "";

  if (!savedVideos.length) {
    videoList.innerHTML = "<p>এখনো কোনো ভিডিও সেভ করা হয়নি।</p>";
    return;
  }

  videoList.innerHTML = savedVideos.map((video, index) => `
    <div class="video-card">
      <div class="thumbnail" onclick="playVideo('${video.id}', ${index}, true)">
        <img src="${video.thumbnail}" alt="ভিডিও থাম্বনেইল">
        <span class="play-icon">▶</span>
      </div>

      <div class="video-info">
        <div class="video-title"
             onclick="playVideo('${video.id}', ${index}, true)">
          ${escapeHTML(video.title)}
        </div>

        <button onclick="toggleSave('${video.id}')">★ সেভ করা</button>
      </div>
    </div>
  `).join("");
}

function showMessage(message) {
  const messageBox = document.getElementById("message");
  if (messageBox) {
    messageBox.textContent = message;
  }
}

function loadYouTubePlayerAPI() {
  if (window.YT && window.YT.Player) {
    createPlayer();
    return;
  }

  window.onYouTubeIframeAPIReady = createPlayer;

  const script = document.createElement("script");
  script.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(script);
}

function createPlayer() {
  if (player) return;

  player = new YT.Player("player", {
    width: "100%",
    height: "100%",
    videoId: "",
    playerVars: {
      playsinline: 1,
      rel: 0
    },
    events: {
      onReady: () => {
        playerReady = true;
      }
    }
  });
}

function playVideo(videoId, index, fromSaved = false) {
  if (!playerReady || !player) {
    showMessage("ভিডিও প্লেয়ার প্রস্তুত হচ্ছে। একটু অপেক্ষা করুন।");
    return;
  }

  const list = fromSaved ? savedVideos : videos;
  currentVideoIndex = index;

  player.loadVideoById(videoId);

  if (playerArea) {
    playerArea.style.display = "block";
  }

  miniMode = false;
  playerArea?.classList.remove("mini-mode");

  if (fromSaved) {
    window.currentPlayList = "saved";
  } else {
    window.currentPlayList = "normal";
  }

  window.scrollTo({ top: 0, behavior: "smooth" });
}

function getCurrentList() {
  return window.currentPlayList === "saved" ? savedVideos : videos;
}

function nextVideo() {
  const list = getCurrentList();
  if (!list.length) return;

  currentVideoIndex = (currentVideoIndex + 1) % list.length;
  playVideo(list[currentVideoIndex].id, currentVideoIndex,
    window.currentPlayList === "saved");
}

function previousVideo() {
  const list = getCurrentList();
  if (!list.length) return;

  currentVideoIndex =
    (currentVideoIndex - 1 + list.length) % list.length;

  playVideo(list[currentVideoIndex].id, currentVideoIndex,
    window.currentPlayList === "saved");
}

function togglePlay() {
  if (!playerReady || !player) return;

  if (player.getPlayerState() === YT.PlayerState.PLAYING) {
    player.pauseVideo();
  } else {
    player.playVideo();
  }
}

function seekVideo(seconds) {
  if (!playerReady || !player) return;

  const current = player.getCurrentTime();
  player.seekTo(Math.max(0, current + seconds), true);
}

function toggleMute() {
  if (!playerReady || !player) return;

  if (player.isMuted()) {
    player.unMute();
  } else {
    player.mute();
  }
}

function toggleFullscreen() {
  const iframe = playerArea?.querySelector("iframe");

  if (iframe?.requestFullscreen) {
    iframe.requestFullscreen();
  }
}

function toggleMiniPlayer() {
  if (!playerArea) return;

  miniMode = !miniMode;
  playerArea.classList.toggle("mini-mode", miniMode);
}

function expandPlayer() {
  miniMode = false;
  playerArea?.classList.remove("mini-mode");
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function toggleSettings() {
  if (!settingsPanel) return;

  settingsPanel.style.display =
    settingsPanel.style.display === "block" ? "none" : "block";
}

/* ভয়েস কন্ট্রোল */

function toggleVoiceControl(enabled) {
  voiceEnabled = enabled;

  if (!("webkitSpeechRecognition" in window)) {
    showMessage("এই WebView-তে ভয়েস কন্ট্রোল সমর্থিত নয়।");
    voiceEnabled = false;
    return;
  }

  if (enabled) {
    startVoiceControl();
  } else {
    stopVoiceControl();
  }
}

function startVoiceControl() {
  if (!voiceEnabled) return;

  recognition = new webkitSpeechRecognition();
  recognition.lang = "bn-BD";
  recognition.continuous = true;
  recognition.interimResults = false;

  recognition.onresult = event => {
    const result = event.results[event.results.length - 1][0]
      .transcript.toLowerCase();

    handleVoiceCommand(result);
  };

  recognition.onerror = () => {
    showMessage("ভয়েস কন্ট্রোলে সমস্যা হয়েছে।");
  };

  recognition.onend = () => {
    if (voiceEnabled) {
      try {
        recognition.start();
      } catch (error) {}
    }
  };

  try {
    recognition.start();
    showMessage("ভয়েস কন্ট্রোল চালু আছে।");
  } catch (error) {
    showMessage("মাইক্রোফোন অনুমতি পরীক্ষা করুন।");
  }
}

function stopVoiceControl() {
  voiceEnabled = false;

  if (recognition) {
    recognition.onend = null;
    recognition.stop();
    recognition = null;
  }

  showMessage("ভয়েস কন্ট্রোল বন্ধ আছে।");
}

function handleVoiceCommand(command) {
  if (
    command.includes("বন্ধ") ||
    command.includes("থাম")
  ) {
    player?.pauseVideo();
  } else if (
    command.includes("চালু") ||
    command.includes("প্লে")
  ) {
    player?.playVideo();
  } else if (
    command.includes("পরের") ||
    command.includes("নেক্সট")
  ) {
    nextVideo();
  } else if (
    command.includes("আগের")
  ) {
    previousVideo();
  } else if (
    command.includes("দশ সেকেন্ড সামনে")
  ) {
    seekVideo(10);
  } else if (
    command.includes("দশ সেকেন্ড পিছনে")
  ) {
    seekVideo(-10);
  } else if (
    command.includes("মিউট")
  ) {
    player?.mute();
  } else if (
    command.includes("আনমিউট")
  ) {
    player?.unMute();
  }
}

/* নিচে স্ক্রল করলে ছোট প্লেয়ার */

window.addEventListener("scroll", () => {
  if (!playerArea || !playerReady) return;

  const rect = playerArea.getBoundingClientRect();

  if (rect.bottom < 0 && !miniMode) {
    toggleMiniPlayer();
  } else if (rect.top > 100 && miniMode) {
    expandPlayer();
  }
});

/* নিচে গেলে নতুন ভিডিও লোড */

window.addEventListener("scroll", () => {
  if (
    window.innerHeight + window.scrollY >=
    document.body.offsetHeight - 500
  ) {
    loadMoreVideos();
  }
});

/* Android Back Button */

window.handleAndroidBack = function() {
  if (settingsPanel && settingsPanel.style.display === "block") {
    settingsPanel.style.display = "none";
    return true;
  }

  if (miniMode) {
    expandPlayer();
    return true;
  }

  return false;
};

/* ক্যাটাগরি বাটন */

document.querySelectorAll(".category-bar button").forEach(button => {
  button.addEventListener("click", () => {
    const category = button.dataset.category;

    if (category === "saved") {
      showSavedVideos();
    } else if (category) {
      changeCategory(category);
    }
  });
});

/* শুরু */

window.addEventListener("load", () => {
  loadYouTubePlayerAPI();
  changeCategory("all");
});
</script>
</body>
</html>

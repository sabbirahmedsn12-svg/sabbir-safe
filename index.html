<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sabbir Safe</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f5f9;
  color:#172033;
}
header{
  background:#075e45;
  color:white;
  padding:17px;
  text-align:center;
  font-size:23px;
  font-weight:bold;
}
.subhead{
  text-align:center;
  padding:8px;
  color:#64748b;
  font-size:13px;
}
.tabs{
  display:flex;
  gap:8px;
  padding:10px;
  overflow-x:auto;
  background:white;
}
.tabs button{
  border:0;
  padding:11px 17px;
  border-radius:20px;
  background:#e2e8f0;
  white-space:nowrap;
  font-weight:bold;
}
.tabs button.active{
  background:#075e45;
  color:white;
}
.actions{
  display:flex;
  gap:8px;
  padding:10px;
}
.actions button,.more-btn{
  border:0;
  border-radius:9px;
  padding:12px;
  background:#075e45;
  color:white;
  font-weight:bold;
}
.actions button{flex:1}
#videoGrid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
  padding:12px;
}
.video-card{
  background:white;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 2px 8px #0001;
}
.video-card img{
  width:100%;
  aspect-ratio:16/9;
  object-fit:cover;
  display:block;
}
.video-title{
  padding:9px;
  font-size:14px;
  font-weight:bold;
  line-height:1.4;
}
.video-card:active{opacity:.8}
#playerSection{
  display:none;
  padding:12px;
  background:#fff;
}
#mainPlayer{
  width:100%;
  aspect-ratio:16/9;
  background:#000;
}
#playingTitle{
  font-weight:bold;
  padding:10px 0;
}
#watchVideoList{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}
#watchVideoList .video-card{box-shadow:none;border:1px solid #e2e8f0}
.more-wrap{
  text-align:center;
  padding:15px;
}
.more-btn{
  width:90%;
  max-width:350px;
}
#status{
  text-align:center;
  padding:12px;
  color:#64748b;
  font-size:13px;
}
button{cursor:pointer}
.hidden{display:none!important}
</style>
</head>

<body>

<header>🛡️ Sabbir Safe</header>
<div class="subhead">নিরাপদ ও শিক্ষামূলক ভিডিও দেখার অ্যাপ</div>

<div class="tabs">
  <button class="active" onclick="selectCategory('kids',this)">শিশুদের ভিডিও</button>
  <button onclick="selectCategory('islamic',this)">ইসলামিক</button>
  <button onclick="selectCategory('madrasa',this)">মাদরাসা শিক্ষা</button>
</div>

<div class="actions">
  <button onclick="openShorts()">Shorts View</button>
  <button onclick="openParent()">অভিভাবক</button>
</div>

<section id="playerSection">
  <div id="mainPlayer"></div>
  <div id="playingTitle"></div>
  <button class="more-btn" onclick="closePlayer()">ভিডিও বন্ধ করুন</button>
  <h3>আরও ভিডিও</h3>
  <div id="watchVideoList"></div>
</section>

<div id="status">ভিডিও লোড হচ্ছে...</div>
<div id="videoGrid"></div>

<div class="more-wrap">
  <button id="moreButton" class="more-btn" onclick="loadMoreVideos()">
    আরও ৫০টি ভিডিও দেখুন
  </button>
</div>
<style>
#shortsScreen{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:#000;
  color:white;
}
.shortsTop{
  display:flex;
  justify-content:space-between;
  padding:14px;
  align-items:center;
}
#shortsStage{
  height:calc(100% - 55px);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  touch-action:pan-y;
}
#shortsPlayer{
  width:min(100%,430px);
  height:min(75vh,760px);
  aspect-ratio:9/16;
  background:#111;
}
#shortsPlayer iframe{
  width:100%;
  height:100%;
}
.shortsTitle{
  padding:12px;
  text-align:center;
}
#parentPanel,#lockScreen{
  display:none;
  position:fixed;
  inset:0;
  z-index:200;
  background:#f1f5f9;
  padding:22px;
  overflow:auto;
}
.panelBox{
  background:white;
  padding:18px;
  border-radius:14px;
  max-width:430px;
  margin:35px auto;
}
.panelBox input,.panelBox select{
  width:100%;
  padding:13px;
  margin:8px 0;
  border:1px solid #cbd5e1;
  border-radius:8px;
  font-size:16px;
}
.panelBox button{
  width:100%;
  border:0;
  border-radius:8px;
  padding:13px;
  margin-top:9px;
  background:#075e45;
  color:white;
  font-weight:bold;
}
.panelBox .danger{background:#b91c1c}
</style>

<div id="shortsScreen">
  <div class="shortsTop">
    <b>Sabbir Safe Shorts</b>
    <button onclick="closeShorts()">✕ বন্ধ</button>
  </div>
  <div id="shortsStage">
    <div id="shortsPlayer"></div>
    <div class="shortsTitle" id="shortsTitle"></div>
    <div>
      <button onclick="previousShort()">↑ আগের</button>
      <button onclick="nextShort()">↓ পরের</button>
    </div>
  </div>
</div>

<div id="parentPanel">
  <div class="panelBox">
    <h2>অভিভাবক সেটিংস</h2>
    <p>ভিডিও দেখার সময়সীমা নির্ধারণ করুন।</p>

    <label>সময় নির্বাচন করুন</label>
    <select id="timeLimit">
      <option value="0">সময় সীমা বন্ধ</option>
      <option value="10">১০ মিনিট</option>
      <option value="20">২০ মিনিট</option>
      <option value="30">৩০ মিনিট</option>
      <option value="60">১ ঘণ্টা</option>
      <option value="120">২ ঘণ্টা</option>
    </select>

    <button onclick="saveTimeLimit()">সময় সংরক্ষণ</button>
    <button onclick="disableLock()">সময়-লক বন্ধ করুন</button>
    <button class="danger" onclick="removeLock()">PIN ও লক মুছে ফেলুন</button>
    <button onclick="changePin()">PIN পরিবর্তন</button>
    <button onclick="closeParent()">বন্ধ করুন</button>
  </div>
</div>

<div id="lockScreen">
  <div class="panelBox">
    <h2>সময় শেষ</h2>
    <p>অভিভাবকের PIN দিয়ে আবার চালু করুন।</p>
    <input id="unlockPin" type="password" placeholder="অভিভাবক PIN">
    <button onclick="unlockApp()">আনলক</button>
  </div>
</div>

<script>
/* নিজের YouTube API Key এখানে বসান */
const API_KEY = "AIzaSyDlQZhB4b0r2D9KxnC7dmFNJdKjFO-T1hs";

/* আপনার প্লেলিস্ট */
const playlists = {
  kids: "PLPr2-LmXD6s4",
  islamic: "PLVn2mfMGbX9o",
  madrasa: "PLa1OIi8h8b48"
};

let category = "kids";
let videos = [];
let nextPageToken = "";
let loading = false;
let mainPlayer = null;
let shortsPlayer = null;
let shortsIndex = 0;
let touchStartY = 0;

function selectCategory(name,button){
  category = name;
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));
  button.classList.add("active");

  videos = [];
  nextPageToken = "";
  document.getElementById("videoGrid").innerHTML = "";
  document.getElementById("watchVideoList").innerHTML = "";
  document.getElementById("playerSection").style.display = "none";
  document.getElementById("status").textContent = "ভিডিও লোড হচ্ছে...";
  loadMoreVideos();
}

async function loadMoreVideos(){
  if(loading) return;
  if(!API_KEY || API_KEY === "YOUR_API_KEY"){
    document.getElementById("status").textContent =
      "YouTube API Key বসান।";
    return;
  }

  if(!nextPageToken && videos.length > 0) return;

  loading = true;
  document.getElementById("moreButton").textContent = "লোড হচ্ছে...";

  try{
    let url = "https://www.googleapis.com/youtube/v3/playlistItems"
      + "?part=snippet&maxResults=50"
      + "&playlistId=" + playlists[category]
      + "&key=" + API_KEY;

    if(nextPageToken){
      url += "&pageToken=" + nextPageToken;
    }

    const response = await fetch(url);
    const data = await response.json();

    if(data.error){
      throw new Error(data.error.message);
    }

    const newVideos = (data.items || []).map(item=>{
      const s = item.snippet;
      return {
        id: s.resourceId.videoId,
        title: s.title,
        thumbnail: s.thumbnails?.medium?.url ||
                   s.thumbnails?.default?.url || ""
      };
    }).filter(v=>v.id);

    videos = videos.concat(newVideos);
    nextPageToken = data.nextPageToken || "";

    renderVideos();

    document.getElementById("status").textContent =
      videos.length + "টি ভিডিও লোড হয়েছে";

    document.getElementById("moreButton").style.display =
      nextPageToken ? "inline-block" : "none";

    if(videos.length === 0){
      document.getElementById("status").textContent =
        "এই প্লেলিস্টে কোনো ভিডিও পাওয়া যায়নি।";
    }
  }catch(error){
    document.getElementById("status").textContent =
      "সমস্যা: " + error.message;
  }

  loading = false;
  document.getElementById("moreButton").textContent =
    "আরও ৫০টি ভিডিও দেখুন";
}

function renderVideos(){
  const grid = document.getElementById("videoGrid");
  grid.innerHTML = "";

  videos.forEach((video,index)=>{
    const card = document.createElement("div");
    card.className = "video-card";
    card.innerHTML = `
      <img src="${video.thumbnail}" alt="">
      <div class="video-title"></div>
    `;
    card.querySelector(".video-title").textContent = video.title;
    card.onclick = ()=>openVideo(index);
    grid.appendChild(card);
  });
}

function openVideo(index){
  const video = videos[index];
  if(!video) return;

  document.getElementById("playerSection").style.display = "block";
  document.getElementById("playingTitle").textContent = video.title;
  document.getElementById("playerSection").scrollIntoView({behavior:"smooth"});

  const playerBox = document.getElementById("mainPlayer");
  playerBox.innerHTML = "";

  const iframe = document.createElement("iframe");
  iframe.width = "100%";
  iframe.height = "100%";
  iframe.src = "https://www.youtube.com/embed/" + video.id + "?autoplay=1";
  iframe.allow = "autoplay; encrypted-media; picture-in-picture";
  iframe.allowFullscreen = true;
  iframe.style.border = "0";
  playerBox.appendChild(iframe);

  const list = document.getElementById("watchVideoList");
  list.innerHTML = "";

  videos.forEach((v,i)=>{
    if(i === index) return;
    const card = document.createElement("div");
    card.className = "video-card";
    card.innerHTML = `<img src="${v.thumbnail}"><div class="video-title"></div>`;
    card.querySelector(".video-title").textContent = v.title;
    card.onclick = ()=>openVideo(i);
    list.appendChild(card);
  });
}

function closePlayer(){
  document.getElementById("playerSection").style.display = "none";
  document.getElementById("mainPlayer").innerHTML = "";
}

function openShorts(){
  if(videos.length === 0){
    alert("আগে ভিডিও লোড করুন।");
    return;
  }
  shortsIndex = 0;
  document.getElementById("shortsScreen").style.display = "block";
  playShort();
}

function playShort(){
  const video = videos[shortsIndex];
  if(!video) return;

  document.getElementById("shortsTitle").textContent = video.title;
  const box = document.getElementById("shortsPlayer");
  box.innerHTML = "";

  const iframe = document.createElement("iframe");
  iframe.src = "https://www.youtube.com/embed/" + video.id + "?autoplay=1";
  iframe.allow = "autoplay; encrypted-media; picture-in-picture";
  iframe.allowFullscreen = true;
  iframe.style.border = "0";
  box.appendChild(iframe);
}

function nextShort(){
  if(shortsIndex < videos.length - 1){
    shortsIndex++;
    playShort();
  }else if(nextPageToken){
    loadMoreVideos().then(()=>{
      if(shortsIndex < videos.length - 1){
        shortsIndex++;
        playShort();
      }
    });
  }else{
    alert("এই প্লেলিস্টের সব লোড করা ভিডিও শেষ।");
  }
}

function previousShort(){
  if(shortsIndex > 0){
    shortsIndex--;
    playShort();
  }
}

function closeShorts(){
  document.getElementById("shortsScreen").style.display = "none";
  document.getElementById("shortsPlayer").innerHTML = "";
}

const shortsStage = document.getElementById("shortsStage");
shortsStage.addEventListener("touchstart",e=>{
  touchStartY = e.changedTouches[0].screenY;
},{passive:true});

shortsStage.addEventListener("touchend",e=>{
  const difference = touchStartY - e.changedTouches[0].screenY;
  if(difference > 60) nextShort();
  if(difference < -60) previousShort();
},{passive:true});

/* অভিভাবক PIN ও সময়সীমা */
function openParent(){
  const savedPin = localStorage.getItem("sabbirPin");

  if(!savedPin){
    const newPin = prompt("নতুন অভিভাবক PIN তৈরি করুন");
    if(!newPin || newPin.length < 4){
      alert("কমপক্ষে ৪ সংখ্যার PIN দিন।");
      return;
    }
    localStorage.setItem("sabbirPin",newPin);
    alert("PIN তৈরি হয়েছে।");
  }else{
    const entered = prompt("অভিভাবক PIN দিন");
    if(entered !== savedPin){
      alert("ভুল PIN!");
      return;
    }
  }

  document.getElementById("parentPanel").style.display = "block";
}

function closeParent(){
  document.getElementById("parentPanel").style.display = "none";
}

function saveTimeLimit(){
  const minutes = Number(document.getElementById("timeLimit").value);

  if(minutes === 0){
    localStorage.removeItem("sabbirDeadline");
    alert("সময়-লক বন্ধ হয়েছে।");
    return;
  }

  const deadline = Date.now() + minutes * 60 * 1000;
  localStorage.setItem("sabbirDeadline",String(deadline));
  alert(minutes + " মিনিটের সময়-লক চালু হয়েছে।");
}

function disableLock(){
  localStorage.removeItem("sabbirDeadline");
  document.getElementById("timeLimit").value = "0";
  alert("সময়-লক বন্ধ হয়েছে।");
}

function removeLock(){
  if(!confirm("PIN ও সময়-লক মুছে ফেলতে চান?")) return;

  localStorage.removeItem("sabbirPin");
  localStorage.removeItem("sabbirDeadline");
  document.getElementById("parentPanel").style.display = "none";
  alert("PIN ও লক মুছে ফেলা হয়েছে।");
}

function changePin(){
  const oldPin = localStorage.getItem("sabbirPin");
  const entered = prompt("পুরোনো PIN দিন");

  if(entered !== oldPin){
    alert("পুরোনো PIN ভুল!");
    return;
  }

  const newPin = prompt("নতুন PIN দিন");
  if(!newPin || newPin.length < 4){
    alert("কমপক্ষে ৪ সংখ্যার PIN দিন।");
    return;
  }

  localStorage.setItem("sabbirPin",newPin);
  alert("PIN পরিবর্তন হয়েছে।");
}

function unlockApp(){
  const savedPin = localStorage.getItem("sabbirPin");
  const entered = document.getElementById("unlockPin").value;

  if(entered === savedPin){
    localStorage.removeItem("sabbirDeadline");
    document.getElementById("lockScreen").style.display = "none";
    document.getElementById("unlockPin").value = "";
  }else{
    alert("ভুল PIN!");
  }
}

function checkLock(){
  const deadline = Number(localStorage.getItem("sabbirDeadline") || 0);

  if(deadline && Date.now() >= deadline){
    document.getElementById("lockScreen").style.display = "block";
  }
}

setInterval(checkLock,1000);

/* Android Back Button */
function handleAndroidBack(){
  if(document.getElementById("lockScreen").style.display === "block"){
    return true;
  }

  if(document.getElementById("parentPanel").style.display === "block"){
    closeParent();
    return true;
  }

  if(document.getElementById("shortsScreen").style.display === "block"){
    closeShorts();
    return true;
  }

  if(document.getElementById("playerSection").style.display === "block"){
    closePlayer();
    return true;
  }

  return false;
}

/* প্রথমবার অ্যাপ চালু */
loadMoreVideos();
</script>

</body>
 </html>
<!-- পর্ব ২-এ Shorts, অভিভাবক PIN, লক ও JavaScript-এর বাকি অংশ থাকবে -->

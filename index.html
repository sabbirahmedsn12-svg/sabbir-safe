<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Sabbir Safe</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f1f3f4;
  color: #0f0f0f;
  font-family: Arial, "Noto Sans Bengali", sans-serif;
}

header {
  height: 58px;
  background: white;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 13px;
  position: sticky;
  top: 0;
  z-index: 20;
  border-bottom: 1px solid #ddd;
}

.logo {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 20px;
  font-weight: bold;
}

.play-logo {
  background: #f00;
  color: white;
  border-radius: 9px;
  padding: 5px 9px;
  font-size: 17px;
}

.header-buttons {
  display: flex;
  gap: 15px;
  align-items: center;
}

.header-buttons button {
  border: none;
  background: transparent;
  font-size: 22px;
  cursor: pointer;
}

.category-bar {
  display: flex;
  gap: 9px;
  padding: 11px;
  background: white;
  overflow-x: auto;
  position: sticky;
  top: 58px;
  z-index: 15;
}

.category {
  border: none;
  background: #eee;
  padding: 8px 17px;
  border-radius: 8px;
  font-size: 14px;
  white-space: nowrap;
  cursor: pointer;
}

.category.active {
  background: #0f0f0f;
  color: white;
}

#playerArea {
  background: #000;
  width: 100%;
  position: relative;
  z-index: 30;
}

#player {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #000;
}

#player iframe {
  width: 100%;
  height: 100%;
  border: 0;
}

#voiceStatus {
  display: none;
  background: #e8f0fe;
  color: #174ea6;
  padding: 8px;
  text-align: center;
  font-size: 13px;
}

.video-controls {
  display: flex;
  align-items: center;
  justify-content: space-around;
  background: #111;
  padding: 9px 4px;
  gap: 3px;
}

.video-controls button {
  border: none;
  color: white;
  background: #303030;
  border-radius: 50%;
  width: 39px;
  height: 39px;
  font-size: 17px;
  cursor: pointer;
}

.video-controls button:active {
  background: #555;
}

#playerTitle {
  background: #fff;
  padding: 10px 12px;
  font-weight: bold;
  font-size: 15px;
}

#videoList {
  padding: 10px;
}

.video-card {
  margin-bottom: 17px;
  cursor: pointer;
  background: white;
}

.video-thumb {
  width: 100%;
  aspect-ratio: 16 / 9;
  object-fit: cover;
  display: block;
  background: #ddd;
}

.video-info {
  display: flex;
  gap: 10px;
  padding: 10px 4px;
}

.channel-icon {
  width: 38px;
  height: 38px;
  flex-shrink: 0;
  border-radius: 50%;
  background: #eee;
  display: flex;
  align-items: center;
  justify-content: center;
}

.video-text {
  min-width: 0;
}

.video-title {
  font-size: 15px;
  font-weight: 600;
  line-height: 1.5;
}

.video-meta {
  color: #606060;
  font-size: 12px;
  margin-top: 5px;
}

#miniPlayer {
  display: none;
  position: fixed;
  bottom: 12px;
  right: 10px;
  width: 190px;
  background: #111;
  z-index: 100;
  box-shadow: 0 2px 12px #0005;
  border-radius: 9px;
  overflow: hidden;
}

#miniPlayer iframe {
  width: 100%;
  aspect-ratio: 16 / 9;
}

#miniPlayer button {
  background: #222;
  color: white;
  border: none;
  padding: 8px;
}

#settingsPanel {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 200;
  background: #0007;
}

.settings-box {
  background: white;
  width: 90%;
  max-width: 400px;
  margin: 70px auto;
  padding: 18px;
  border-radius: 13px;
}

.settings-box h3 {
  margin-top: 0;
}

.setting-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 13px 0;
  border-bottom: 1px solid #eee;
}

.setting-row input {
  width: 21px;
  height: 21px;
}

.settings-box button {
  border: none;
  background: #eee;
  padding: 10px 16px;
  border-radius: 7px;
  font-size: 14px;
}

#voiceMessage {
  color: #555;
  font-size: 12px;
  line-height: 1.6;
}

#loadMore {
  display: block;
  margin: 20px auto;
  padding: 12px 25px;
  border: none;
  background: #ddd;
  border-radius: 20px;
  font-size: 14px;
}

#shortsScreen {
  display: none;
  position: fixed;
  inset: 0;
  background: #000;
  z-index: 150;
}

#shortsVideo {
  width: 100%;
  height: 100%;
  background: #000;
}

@media (min-width: 700px) {
  #videoList {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">
    <span class="play-logo">▶</span>
    <span>Sabbir Safe</span>
  </div>

  <div class="header-buttons">
    <button onclick="openSettings()" title="সেটিংস">⚙️</button>
  </div>
</header>

<div class="category-bar">
  <button class="category active" onclick="changeCategory('kids',this)">শিশু</button>
  <button class="category" onclick="changeCategory('islamic',this)">ইসলামিক</button>
  <button class="category" onclick="changeCategory('madrasa',this)">মাদরাসা</button>
</div>

<div id="voiceStatus">
  🎙️ ভয়েস কন্ট্রোল চালু — কথা বলুন
</div>

<div id="playerArea">

  <div id="player"></div>

  <div class="video-controls">
    <button onclick="previousVideo()" title="আগের ভিডিও">⏮</button>
    <button onclick="seekVideo(-10)" title="১০ সেকেন্ড পিছনে">↶</button>
    <button onclick="togglePlay()" id="playButton" title="চালু/বন্ধ">⏯</button>
    <button onclick="seekVideo(10)" title="১০ সেকেন্ড সামনে">↷</button>
    <button onclick="nextVideo()" title="পরের ভিডিও">⏭</button>
    <button onclick="toggleMute()" title="সাউন্ড">🔊</button>
    <button onclick="fullScreenVideo()" title="ফুলস্ক্রিন">⛶</button>
  </div>

</div>

<div id="playerTitle">
  Sabbir Safe — একটি ভিডিও নির্বাচন করুন
</div>

<div id="videoList"></div>

<button id="loadMore" onclick="loadMoreVideos()">
  আরও ভিডিও দেখুন
</button>

<div id="miniPlayer">
  <div id="miniPlayerInfo" style="color:white;padding:7px;font-size:12px">
    ভিডিও চলছে
  </div>
  <button onclick="expandPlayer()">ভিডিও বড় করুন</button>
</div>

<div id="settingsPanel">
  <div class="settings-box">
    <h3>⚙️ Sabbir Safe সেটিংস</h3>

    <div class="setting-row">
      <span>🎙️ ভয়েস কন্ট্রোল</span>
      <input type="checkbox" id="voiceToggle"
        onchange="toggleVoice(this.checked)">
    </div>

    <p id="voiceMessage">
      চালু করলে কথা বলে ভিডিও নিয়ন্ত্রণ করতে পারবেন।
    </p>

    <button onclick="closeSettings()">বন্ধ করুন</button>
  </div>
</div>

<div id="shortsScreen">
  <div id="shortsVideo"></div>
  <button onclick="closeShorts()"
    style="position:absolute;top:15px;right:15px">
    বন্ধ
  </button>
</div>
  
<script>
/* YouTube API */
const API_KEY = "AIzaSyDlQZhB4b0r2D9KxnC7dmFNJdKjFO-T1hs";
const PLAYLISTS = {
  kids: "PLPr2-LmXD6s4",
  islamic: "PLVn2mfMGbX9o",
  madrasa: "PLa1OIi8h8b48"
};

let currentCategory = "kids";
let videos = [];
let currentIndex = -1;
let nextPageToken = "";
let loading = false;
let player = null;
let playerReady = false;
let voiceRecognition = null;
let voiceEnabled = false;
let miniMode = false;

const videoList = document.getElementById("videoList");

/* YouTube Player API */
function loadYouTubePlayerAPI() {
  const tag = document.createElement("script");
  tag.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(tag);
}

function onYouTubeIframeAPIReady() {
  player = new YT.Player("player", {
    width: "100%",
    height: "100%",
    playerVars: {
      autoplay: 0,
      controls: 1,
      playsinline: 1,
      rel: 0,
      enablejsapi: 1
    },
    events: {
      onReady: function() {
        playerReady = true;
      }
    }
  });
}

loadYouTubePlayerAPI();

/* Category */
async function changeCategory(category, button) {
  currentCategory = category;

  document.querySelectorAll(".category").forEach(b => {
    b.classList.remove("active");
  });

  button.classList.add("active");

  videos = [];
  currentIndex = -1;
  nextPageToken = "";
  videoList.innerHTML = "";

  if (playerReady) {
    player.stopVideo();
  }

  document.getElementById("playerTitle").textContent =
    "ভিডিও নির্বাচন করুন";

  await loadMoreVideos();
}

/* Load videos from playlist */
async function loadMoreVideos() {
  if (loading || !API_KEY || API_KEY === "YOUR_API_KEY") {
    if (API_KEY === "YOUR_API_KEY") {
      alert("প্রথমে আপনার YouTube API Key বসান।");
    }
    return;
  }

  if (!PLAYLISTS[currentCategory]) return;

  loading = true;

  const playlist = PLAYLISTS[currentCategory];

  let url =
    "https://www.googleapis.com/youtube/v3/playlistItems" +
    "?part=snippet&maxResults=50" +
    "&playlistId=" + playlist +
    "&key=" + encodeURIComponent(API_KEY);

  if (nextPageToken) {
    url += "&pageToken=" + encodeURIComponent(nextPageToken);
  }

  try {
    const response = await fetch(url);
    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error?.message || "ভিডিও লোড হয়নি");
    }

    nextPageToken = data.nextPageToken || "";

    const newVideos = (data.items || [])
      .filter(item =>
        item.snippet?.resourceId?.videoId
      )
      .map(item => ({
        id: item.snippet.resourceId.videoId,
        title: item.snippet.title,
        channel: item.snippet.videoOwnerChannelTitle || "Sabbir Safe",
        image: item.snippet.thumbnails?.medium?.url ||
               item.snippet.thumbnails?.default?.url
      }));

    videos.push(...newVideos);

    renderVideos(newVideos);

    document.getElementById("loadMore").style.display =
      nextPageToken ? "block" : "none";

  } catch (error) {
    alert("ভিডিও লোড করতে সমস্যা হয়েছে: " + error.message);
  }

  loading = false;
}

/* Video cards */
function renderVideos(list) {
  list.forEach(video => {
    const card = document.createElement("div");
    card.className = "video-card";

    const img = document.createElement("img");
    img.className = "video-thumb";
    img.src = video.image || "";
    img.alt = video.title;
    img.loading = "lazy";

    const info = document.createElement("div");
    info.className = "video-info";

    const icon = document.createElement("div");
    icon.className = "channel-icon";
    icon.textContent = "▶";

    const text = document.createElement("div");
    text.className = "video-text";

    const title = document.createElement("div");
    title.className = "video-title";
    title.textContent = video.title;

    const meta = document.createElement("div");
    meta.className = "video-meta";
    meta.textContent = video.channel;

    text.appendChild(title);
    text.appendChild(meta);

    info.appendChild(icon);
    info.appendChild(text);

    card.appendChild(img);
    card.appendChild(info);

    card.onclick = () => playVideo(video.id);

    videoList.appendChild(card);
  });
}

/* Play selected video */
function playVideo(id) {
  const index = videos.findIndex(v => v.id === id);

  if (index < 0 || !playerReady) return;

  currentIndex = index;

  player.loadVideoById(id);

  document.getElementById("playerTitle").textContent =
    videos[index].title;

  document.getElementById("miniPlayerInfo").textContent =
    videos[index].title;

  miniMode = false;
  document.getElementById("miniPlayer").style.display = "none";

  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* Player controls */
function togglePlay() {
  if (!playerReady) return;

  const state = player.getPlayerState();

  if (state === YT.PlayerState.PLAYING) {
    player.pauseVideo();
  } else {
    player.playVideo();
  }
}

function seekVideo(seconds) {
  if (!playerReady) return;

  const current = player.getCurrentTime();
  player.seekTo(Math.max(0, current + seconds), true);
}

function nextVideo() {
  if (currentIndex < videos.length - 1) {
    playVideo(videos[currentIndex + 1].id);
  } else {
    loadMoreVideos().then(() => {
      if (currentIndex < videos.length - 1) {
        playVideo(videos[currentIndex + 1].id);
      }
    });
  }
}

function previousVideo() {
  if (currentIndex > 0) {
    playVideo(videos[currentIndex - 1].id);
  }
}

function toggleMute() {
  if (!playerReady) return;

  if (player.isMuted()) {
    player.unMute();
  } else {
    player.mute();
  }
}

function fullScreenVideo() {
  const iframe = document.querySelector("#player iframe");

  if (iframe?.requestFullscreen) {
    iframe.requestFullscreen();
  } else if (iframe?.webkitRequestFullscreen) {
    iframe.webkitRequestFullscreen();
  }
}

/* Mini player while scrolling */
window.addEventListener("scroll", () => {
  const area = document.getElementById("playerArea");

  if (!playerReady || currentIndex < 0) return;

  const rect = area.getBoundingClientRect();

  if (rect.bottom < 0) {
    miniMode = true;
    document.getElementById("miniPlayer").style.display = "block";
  } else {
    miniMode = false;
    document.getElementById("miniPlayer").style.display = "none";
  }
});

function expandPlayer() {
  document.getElementById("playerArea").scrollIntoView({
    behavior: "smooth",
    block: "start"
  });

  document.getElementById("miniPlayer").style.display = "none";
}

/* Settings */
function openSettings() {
  document.getElementById("settingsPanel").style.display = "block";
}

function closeSettings() {
  document.getElementById("settingsPanel").style.display = "none";
}

/* Voice control */
function toggleVoice(enabled) {
  voiceEnabled = enabled;

  if (enabled) {
    startVoiceControl();
  } else {
    stopVoiceControl();
  }
}

function startVoiceControl() {
  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    alert("এই ফোনের ব্রাউজারে বাংলা ভয়েস কন্ট্রোল সমর্থিত নয়।");
    document.getElementById("voiceToggle").checked = false;
    voiceEnabled = false;
    return;
  }

  if (voiceRecognition) {
    voiceRecognition.stop();
  }

  voiceRecognition = new SpeechRecognition();
  voiceRecognition.lang = "bn-BD";
  voiceRecognition.continuous = true;
  voiceRecognition.interimResults = false;

  voiceRecognition.onresult = function(event) {
    const result =
      event.results[event.results.length - 1][0].transcript;

    handleVoiceCommand(result);
  };

  voiceRecognition.onerror = function(event) {
    document.getElementById("voiceMessage").textContent =
      "ভয়েস সমস্যা: " + event.error;
  };

  voiceRecognition.onend = function() {
    if (voiceEnabled) {
      setTimeout(() => {
        if (voiceEnabled && voiceRecognition) {
          try {
            voiceRecognition.start();
          } catch(e) {}
        }
      }, 700);
    }
  };

  try {
    voiceRecognition.start();
    document.getElementById("voiceStatus").style.display = "block";
    document.getElementById("voiceMessage").textContent =
      "ভয়েস কন্ট্রোল চালু আছে। বন্ধ না করা পর্যন্ত নির্দেশ শুনবে।";
  } catch(error) {
    document.getElementById("voiceMessage").textContent =
      "মাইক্রোফোন চালু করা যায়নি। অনুমতি পরীক্ষা করুন।";
  }
}

function stopVoiceControl() {
  voiceEnabled = false;

  if (voiceRecognition) {
    voiceRecognition.onend = null;
    voiceRecognition.stop();
    voiceRecognition = null;
  }

  document.getElementById("voiceStatus").style.display = "none";
  document.getElementById("voiceMessage").textContent =
    "ভয়েস কন্ট্রোল বন্ধ আছে।";
}

function handleVoiceCommand(command) {
  const text = command.toLowerCase();

  if (
    text.includes("থামো") ||
    text.includes("স্টপ") ||
    text.includes("বন্ধ করো")
  ) {
    if (playerReady) player.pauseVideo();
    return;
  }

  if (
    text.includes("চালু করো") ||
    text.includes("চালাও") ||
    text.includes("প্লে")
  ) {
    if (playerReady) player.playVideo();
    return;
  }

  if (
    text.includes("আরেকটা") ||
    text.includes("পরের ভিডিও") ||
    text.includes("ভিডিও বদল") ||
    text.includes("ওয়াজ বদল") ||
    text.includes("আরেকটা ওয়াজ")
  ) {
    nextVideo();
    return;
  }

  if (
    text.includes("আগের ভিডিও") ||
    text.includes("আগের ওয়াজ")
  ) {
    previousVideo();
    return;
  }

  if (
    text.includes("দশ সেকেন্ড পিছনে") ||
    text.includes("পিছনে যাও")
  ) {
    seekVideo(-10);
    return;
  }

  if (
    text.includes("দশ সেকেন্ড সামনে") ||
    text.includes("সামনে যাও")
  ) {
    seekVideo(10);
    return;
  }

  if (
    text.includes("শব্দ বন্ধ") ||
    text.includes("মিউট")
  ) {
    if (playerReady) player.mute();
    return;
  }

  if (text.includes("শব্দ চালু")) {
    if (playerReady) player.unMute();
    return;
  }
}

/* Shorts placeholder */
function closeShorts() {
  document.getElementById("shortsScreen").style.display = "none";
}

/* Android back */
window.handleAndroidBack = function() {
  const settings = document.getElementById("settingsPanel");

  if (settings.style.display === "block") {
    closeSettings();
    return true;
  }

  if (document.getElementById("shortsScreen").style.display === "block") {
    closeShorts();
    return true;
  }

  if (miniMode) {
    expandPlayer();
    return true;
  }

  return false;
};

/* First playlist */
window.addEventListener("load", () => {
  loadMoreVideos();
});
</script>

</body>
</html>
<!-- পর্ব ২ এখানে যুক্ত হবে -->
